{% extends "base.html" %}
{% block title %}Скрипт{% endblock %}
{% block content %}
<h1 class="h3">{% if script %}Изменить скрипт{% else %}Новый скрипт{% endif %}</h1>
<form method="post" action="{% if script %}{{ url_for('scripts.update_script', script_id=script.id) }}{% else %}{{ url_for('scripts.create_script') }}{% endif %}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="name">Название</label>
    <input class="form-control" id="name" name="name" required value="{{ script.name if script else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="description">Описание</label>
    <textarea class="form-control" id="description" name="description" rows="2">{{ script.description if script else '' }}</textarea>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label" for="target_os">ОС</label>
      <select class="form-select" id="target_os" name="target_os">
        <option value="windows" {% if script and script.target_os == 'windows' %}selected{% endif %}>windows</option>
        <option value="linux" {% if script and script.target_os == 'linux' %}selected{% endif %}>linux</option>
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label" for="interpreter">Интерпретатор</label>
      <select class="form-select" id="interpreter" name="interpreter">
        {% for item in ['powershell', 'cmd', 'bash'] %}
        <option value="{{ item }}" {% if script and script.interpreter == item %}selected{% endif %}>{{ item }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label" for="storage">Где хранить</label>
      <select class="form-select" id="storage" name="storage">
        <option value="db" {% if not script or script.storage == 'db' %}selected{% endif %}>в базе</option>
        <option value="filesystem" {% if script and script.storage == 'filesystem' %}selected{% endif %}>в файле</option>
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="content">Текст скрипта</label>
    <textarea class="form-control font-monospace" id="content" name="content" rows="12">{{ script_body if script_body is defined else (script.content if script and script.content else '') }}</textarea>
  </div>
  <button class="btn btn-primary" type="submit">Сохранить</button>
</form>
{% if script %}
<form method="post" action="{{ url_for('scripts.delete_script', script_id=script.id) }}" class="mt-3" onsubmit="return confirm('Удалить скрипт?');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-outline-danger" type="submit">Удалить</button>
</form>
<form method="post" action="{{ url_for('scripts.run_script', script_id=script.id) }}" class="mt-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2 class="h5">Запуск</h2>
  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label" for="device_id">Устройство</label>
      <select class="form-select" id="device_id" name="device_id">
        <option value="">— не выбрано —</option>
        {% for device in devices|default([]) %}
        <option value="{{ device.id }}">{{ device.ip }}{% if device.hostname %} — {{ device.hostname }}{% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="sector_id">или весь сектор</label>
      <select class="form-select" id="sector_id" name="sector_id">
        <option value="">— не выбран —</option>
        {% for sector in sectors|default([]) %}
        <option value="{{ sector.id }}">{{ sector.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2 align-self-end">
      <button class="btn btn-warning" type="submit">Запустить</button>
    </div>
  </div>
</form>
{% endif %}
{% endblock %}
