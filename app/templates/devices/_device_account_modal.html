{% if current_user.is_authenticated %}
<div class="modal fade" id="device-shell-modal" tabindex="-1" aria-labelledby="device-shell-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="device-shell-modal-title">Учётная запись процесса</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-3" id="device-shell-modal-hint">Учётная запись процесса</p>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-outline-secondary" data-shell-run-as="psexec">Учётка веб-панели</button>
          <button type="button" class="btn btn-outline-secondary" data-shell-run-as="system">NT AUTHORITY\SYSTEM</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Отмена</button>
      </div>
    </div>
  </div>
</div>
{% endif %}
