# bAWH слушает снаружи только через Nginx.
# Gunicorn остаётся на 127.0.0.1:8000.
#
# TLS позже завершается здесь (сертификат и listen 443 добавляются на этот server).
# После включения HTTPS поставьте в /opt/bawh/.env SESSION_COOKIE_SECURE=1
# и выполните: sudo systemctl restart bawh-web
#
# server_name замените на имя этого сервера в сети компании.

server {
    listen 80;
    server_name bawh.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
