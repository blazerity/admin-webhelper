# bAWH снаружи открыт через Nginx на порту 80, на всех сетевых интерфейсах.
# Запрос по IP сервера в локальной сети попадает в этот server:
# listen ... default_server принимает Host, который не совпал с именем.
# Gunicorn остаётся на 127.0.0.1:8000, с других машин к порту 8000 не подключаются.
#
# HTTPS включается из Параметров (сертификат + ключ) скриптом
# deploy/apply-nginx-tls.sh — он перезаписывает этот сайт, но сохраняет /vnc/ws.
# После включения HTTPS можно поставить SESSION_COOKIE_SECURE=1 тем же экраном.
#
# /vnc/ws — WebSocket к bawh-vnc на 127.0.0.1:6080 (noVNC). Без билета прокси
# соединение не открывает.

server {
    listen 80 default_server;
    server_name _ bawh.example.com;
    client_max_body_size 4m;

    location /vnc/ws {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
