# bAWH снаружи открыт через Nginx на порту 80, на всех сетевых интерфейсах.
# Запрос по IP сервера в локальной сети попадает в этот server:
# listen ... default_server принимает Host, который не совпал с именем.
# Gunicorn остаётся на 127.0.0.1:8000, с других машин к порту 8000 не подключаются.
#
# TLS позже завершается здесь (сертификат и listen 443 добавляются на этот server).
# После включения HTTPS поставьте в /opt/bawh/.env SESSION_COOKIE_SECURE=1
# и выполните: sudo systemctl restart bawh-web

server {
    listen 80 default_server;
    server_name _ bawh.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
